response_task:
  description: >
    Provide a clear and concise answer to the user's question: "{question_state}".
    - Your response must be strictly based on the explicitly provided information from the document: "{document_state}".
    - Include all directly relevant information while ensuring clarity and accuracy.
    - Do not make assumptions, interpretations, or add any details not explicitly stated in the document.
    - Adress exact the user's question
  expected_output: >
    A concise, factually accurate answer to the user's question, explicitly supported by the provided document.
  agent: response_agent

